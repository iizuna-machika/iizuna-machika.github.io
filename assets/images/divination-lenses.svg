<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <title>六つの占術と三つの縄</title>
  <desc>時の縄、星の縄、名の縄を相談の問いに照らし合わせて結びます。陰陽五行は解釈を補う共通理論です。</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#243f51"/>
      <stop offset="1" stop-color="#152a3a"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#d7b982" stroke-width="2.5">
    <path d="M102 156v16q0 27 38 27h160v17M300 156v60M498 156v16q0 27-38 27H300"/>
  </g>
  <g fill="url(#panel)" stroke-width="1.5">
    <rect x="8" y="12" width="188" height="144" rx="14" stroke="#d7b982"/>
    <rect x="206" y="12" width="188" height="144" rx="14" stroke="#a5c3c0"/>
    <rect x="404" y="12" width="188" height="144" rx="14" stroke="#c9b4cd"/>
    <rect x="180" y="216" width="240" height="57" rx="28" stroke="#d7b982"/>
  </g>
  <g stroke="#b4c4c3" stroke-opacity=".35">
    <path d="M28 62h148m50 0h148m50 0h148"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="24">
    <text x="102" y="48" fill="#efd2a0" font-weight="bold">時の縄</text>
    <text x="300" y="48" fill="#c1dfda" font-weight="bold">星の縄</text>
    <text x="498" y="48" fill="#e2cfe6" font-weight="bold">名の縄</text>
    <g fill="#fff1d9">
      <text x="102" y="96">四柱推命</text>
      <text x="102" y="132">九星気学</text>
      <text x="300" y="96">西洋占星術</text>
      <text x="300" y="132">宿曜占星術</text>
      <text x="498" y="96">姓名判断</text>
      <text x="498" y="132">言霊学</text>
      <text x="300" y="252" font-weight="bold">相談の問いに結ぶ</text>
    </g>
    <rect x="143" y="295" width="314" height="43" rx="8" fill="#172b3a" stroke="#a5c3c0" stroke-dasharray="4 5"/>
    <text x="300" y="324" font-size="22" fill="#c1dfda">共通の補助理論　陰陽五行</text>
  </g>
</svg>
